<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>校准 · 抬手推子 — Phone MIDI CC</title>
<link rel="stylesheet" href="ios.css?v=4">
<style>
  /* 页面专属：360px 宽的单栏向导。模式身份色用 iOS 的 tint 表达（只有浅色一套）。 */
  :root { --blue: #007aff; }
  body { display: flex; flex-direction: column; align-items: center; }
  .nav, .card, .error, .foot { width: 100%; max-width: 360px; }
  .card { padding: 22px 20px; }
  .preview { display: none; margin: 8px 0 20px; }
  .preview.show { display: block; }
  .desc { margin-bottom: 22px; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 12px; }
  .step-label { margin-bottom: 8px; }
  .steps { margin-bottom: 18px; }
  .btn { display: block; width: 100%; margin-top: 8px; }
  .btn-ghost { margin-top: 16px; }
  .error { margin-top: 12px; }
</style>
</head>
<body data-profile="lift">

<nav class="nav"><a href="/?mode=A">← 返回主控制页</a></nav>

<div class="card">
  <div class="mode-tag">Mode A · 抬手推子</div>
  <div class="step-label" id="stepLabel">步骤 1 / 3</div>
  <div class="steps" id="stepDots">
    <span class="step-dot active"></span>
    <span class="step-dot"></span>
    <span class="step-dot"></span>
  </div>

  <h1 id="pageTitle">校准 · 抬手推子 (A)</h1>
  <p class="desc" id="stepDesc">竖屏握持，与平时演奏相同。手臂自然下垂，然后点击下方按钮。</p>
  <h2 id="stepTitle" style="font-size:17px;font-weight:600;text-align:center;margin-bottom:8px">确认最低位置</h2>

  <div class="preview" id="previewBlock">
    <div class="cc-label" id="previewLabel">抬手预览 · CC 0 – 127</div>
    <div class="cc-big" id="ccVal">—</div>
    <div class="bar-wrap" style="margin-top:12px"><div class="bar-fill" id="ccBar"></div></div>
  </div>

  <button class="btn btn-primary" id="btnAction" type="button">确认：这是最低位置 (0)</button>
  <button class="btn btn-ghost" id="btnBack" type="button" style="display:none">上一步</button>
</div>

<p class="error" id="error"></p>
<p class="foot">校准仅用于 Mode A，保存在本机浏览器。换手机或清除站点数据后需重新校准。</p>

<div class="toast" id="toast"></div>

<script src="fusion.js?v=23"></script>
<script src="calibrate-wizard.js?v=22"></script>
</body>
</html>
