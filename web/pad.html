<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shortcut Pad</title>
<link rel="stylesheet" href="ios.css?v=11">
<style>
  /* 页面专属：单屏不滚动，网格固定 2 列 × 4 行（形状与 padgrid.js 的 COLS/ROWS 必须一致）。
     面板是**铺满整屏**的那一个宿主；推子页底部的第 4 页条用的是同一份格子，但只占一小块。 */
  body { display: flex; flex-direction: column; gap: 10px;
         height: 100dvh; overflow: hidden; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
         touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; }
  header { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  #pageTitle { flex: 1 1 auto; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grid { flex: 1 1 auto; min-height: 0; display: grid; gap: 8px;
          grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  #grid.offline .cell { pointer-events: none; opacity: 0.4; }
  #tabs { flex: 0 0 auto; }   /* 2 行 × 3 列的 grid 在 ios.css 里；这里**不能**再写 display，会盖掉它 */
  #err { flex: 0 0 auto; min-height: 15px; font-size: 13px; color: var(--orange); margin: 0; }
  .foot { margin-top: 0; justify-content: flex-start; }
</style>
</head>
<body>

<header>
  <a class="btn-back" href="/">‹ 返回</a>
  <h1 id="pageTitle">快捷键面板</h1>
  <span class="status wait" id="conn">连接中…</span>
</header>

<main id="grid"></main>
<nav id="tabs" class="hidden"></nav>

<p id="err"></p>
<p class="foot-brand">Powered by Levi黄</p>

<!-- 格子本身（建格/绘制/按下/离线拒按/震动）与推子页底部的第 4 页条共用一份实现 -->
<script src="padgrid.js?v=1"></script>
<script src="pad.js?v=30"></script>
</body>
</html>
