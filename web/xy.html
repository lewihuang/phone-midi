<!DOCTYPE html>
<html lang="zh-CN" data-route="phone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>X/Y Pad</title>
<link rel="stylesheet" href="ios.css?v=11">
<!-- 平板有专用页（48 格 / X/Y）：误入手机版就送过去。 -->
<script src="device.js?v=1"></script>
<style>
  /* 页面专属：顶栏 / 正方形控制面 / 一行读数+动作 / 一行 CC 配置。整屏不滚动。 */
  body { display: flex; flex-direction: column; align-items: center; }
  .topbar { max-width: 420px; }
  /* 快速预设：只是"一键把两个 CC 号填好"，**不锁定** —— 输入框照样能手改，
     高亮如实反映当前那两个号（手改成别的值就两个都不亮）。 */
  .xy-presets { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .xy-presets .btn { min-height: 34px; padding: 0 14px; font-size: 15px; border-radius: 9px; }
  .xy-presets .btn.sel { background: var(--blue); color: #fff; }
</style>
</head>
<body>

<nav class="topbar"><a class="btn-back" href="/">‹ 返回</a></nav>

<div class="xy-wrap">

  <div class="xy-plane unset" id="plane">
    <div class="xy-h"></div>
    <div class="xy-v"></div>
    <div class="xy-marker"></div>
  </div>

  <div class="xy-actions">
    <button class="btn btn-ghost" id="btnCenter" type="button">回中</button>
    <button class="btn btn-ghost" id="btnFreeze" type="button">冻结</button>
  </div>

  <p class="xy-readout dim" id="readout">未连接</p>
  <p class="xy-readout dim" id="hint"></p>

  <div class="xy-presets" id="presets">
    <span class="range-label">快速预设</span>
    <button class="btn btn-ghost" id="presetExpr" type="button"
            title="X = CC1（调制/颤音）、Y = CC11（表情）；只填这两个号，仍可手改。注意与推子同用 CC1，别和推子同时跑">弦乐表情</button>
    <button class="btn btn-ghost" id="presetXy" type="button"
            title="X = CC20、Y = CC21（默认）；只填这两个号，仍可手改">X/Y Pad</button>
  </div>

  <div class="xy-cfg">
    <span class="range-label">X CC</span>
    <input class="range-input" id="ccX" type="number" min="0" max="127" step="1" value="20">
    <span class="range-label">Y CC</span>
    <input class="range-input" id="ccY" type="number" min="0" max="127" step="1" value="21">
    <span class="range-label">Ch</span>
    <select class="cfg-select" id="selCh" aria-label="MIDI 通道"></select>
  </div>

</div>

<p class="foot-brand">Powered by Levi黄</p>

<script src="xy.js?v=2"></script>
</body>
</html>
