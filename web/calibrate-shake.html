<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>力度精调 · 摇晃弯音</title>
<link rel="stylesheet" href="ios.css?v=10">
<style>
  /* 页面专属：360px 宽的单栏向导。模式身份色用 iOS 的 tint 表达（只有浅色一套）。 */
  :root { --blue: #34c759; }
  body { display: flex; flex-direction: column; align-items: center; }
  .nav, .card, .error, .foot { width: 100%; max-width: 360px; }
  .card { padding: 22px 20px; }
  .preview { display: none; margin: 8px 0 20px; }
  .preview.show { display: block; }
  .desc { margin-bottom: 22px; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 12px; }
  .step-label { margin-bottom: 8px; }
  .steps { margin-bottom: 18px; }
  .btn { display: block; width: 100%; margin-top: 8px; }
  .btn-ghost { margin-top: 16px; }
  .error { margin-top: 12px; }
</style>
</head>
<body data-profile="shake">

<nav class="topbar"><a class="btn-back" href="/fader.html?mode=C">‹ 返回</a></nav>

<div class="card">
  <div class="mode-tag">Mode C · 摇晃弯音</div>
  <div class="step-label" id="stepLabel">步骤 1 / 3</div>
  <div class="steps" id="stepDots">
    <span class="step-dot active"></span>
    <span class="step-dot"></span>
    <span class="step-dot"></span>
  </div>

  <h1 id="pageTitle">力度精调 · 摇晃弯音 (C)</h1>
  <h2 id="stepTitle">确认静止零位</h2>
  <p class="desc" id="stepDesc">把手机以演奏姿势拿好，保持不动约 2 秒。</p>

  <div class="preview" id="previewBlock">
    <div class="cc-label" id="previewLabel">弯音预览 · Pitch Bend</div>
    <div class="cc-big" id="ccVal">8192</div>
    <div class="bar-wrap" style="margin-top:12px"><div class="bar-fill" id="ccBar"></div></div>
  </div>

  <button class="btn btn-primary" id="btnAction" type="button">开始：保持静止</button>
  <button class="btn btn-ghost" id="btnBack" type="button" style="display:none">上一步</button>
</div>

<p class="error" id="error"></p>
<p class="foot">
  这一步是<b>可选</b>的：不校准也能用，力度刻度是一个<b>固定值</b>（默认 80 m/s²，可在调试页调整）。<br>
  校准的作用是把「晃多猛 = 弯多少」按你自己的力度标定一次，之后恒定不变。<br>
  结果保存为 <code>phone-midi/calibration/shake/v2</code>，只影响 Mode C。
</p>

<p class="foot-brand">Powered by Levi黄</p>

<div class="toast" id="toast"></div>

<script src="fusion.js?v=23"></script>
<script src="calibrate-wizard.js?v=23"></script>
</body>
</html>
